services:
  app:
    build: .
    container_name: devops-assignment-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URL: mongodb://database:27017/devops_assignment
    depends_on:
      database:
        condition: service_healthy
    networks:
      - devops-network
    restart: unless-stopped

  database:
    image: mongo:7
    container_name: devops-assignment-database
    volumes:
      - mongo-data:/data/db
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  devops-network:
    name: devops-assignment-network
    driver: bridge

volumes:
  mongo-data:
    name: devops-assignment-mongo-data
